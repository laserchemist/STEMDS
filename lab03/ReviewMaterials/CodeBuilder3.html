<div id="cb-root-%%UID%%"
     style="
        display:grid;
        grid-template-columns:450px 1fr;
        gap:18px;
        max-width:1400px;
        margin:12px auto;
        font-family:Segoe UI,Arial,sans-serif;
        align-items:start;">

  <!-- LEFT PANEL -->
<div style="
    background:#fff;
    border:1px solid #ddd;
    border-radius:16px;
    padding:18px;
    max-height:600px;
    overflow-y:auto;">

    <div style="font-size:20px;
                font-weight:700;
                margin-bottom:14px;">
      Code Blocks
    </div>

    <div id="cb-blocks-%%UID%%"
         style="display:flex;
                flex-wrap:wrap;
                gap:10px;">
    </div>

    <button id="cb-clear-%%UID%%"
            style="margin-top:18px;
                   width:100%;
                   background:#d64545;
                   color:white;
                   border:none;
                   border-radius:10px;
                   padding:10px;
                   font-size:14px;
                   font-weight:600;
                   cursor:pointer;">
      Clear Workspace
    </button>
  </div>

  <!-- RIGHT PANEL -->
<div style="background:#fff;
            border:1px solid #e5e5e5;
            border-radius:16px;
            padding:18px;
            overflow:hidden;
            display:flex;
            flex-direction:column;">

    <div style="font-size:20px;
                font-weight:700;
                margin-bottom:14px;">
      Workspace
    </div>

    <!-- DROP SLOTS -->
    <div id="cb-slots-%%UID%%"
         style="display:flex;
                flex-wrap:wrap;
                gap:12px;
                margin-bottom:22px;">
    </div>

    <!-- LIVE CODE -->
    <div id="cb-code-%%UID%%"
         style="background:#111;
                color:#5cff87;
                font-family:Consolas,monospace;
                border-radius:12px;
                min-height:70px;
                padding:16px;
                font-size:18px;
                margin-bottom:20px;">
      Your code will appear here...
    </div>

    <!-- TEMPLATE PREVIEW -->
    <div style="background:#eef5ff;
                border:1px solid #cfe0ff;
                border-radius:12px;
                padding:16px;">

      <div style="font-size:11px;
                  font-weight:700;
                  letter-spacing:1.5px;
                  color:#4d79d8;
                  margin-bottom:8px;
                  text-transform:uppercase;">
        Function Structure
      </div>

      <div id="cb-template-%%UID%%"
           style="font-family:Consolas,monospace;
                  font-size:18px;
                  color:#222;">
        Click or drag a function block.
      </div>
    </div>
    <button id="cb-check-%%UID%%"
        style="
          margin-top:10px;
          width:100%;
          background:#4caf50;
          color:white;
          border:none;
          padding:10px;
          border-radius:10px;
          font-weight:600;
          cursor:pointer;">
  Check Answer
</button>

<div id="cb-feedback-%%UID%%"
     style="margin-top:10px;font-weight:600;"></div>
  </div>
</div>

const UID = %%UID%%;

const activeLevel = "__LEVEL__";

/* -----------------------------
   STATE ACCESS (ipywidgets)
------------------------------ */
function getStateTextarea() {
    return document.querySelector(`.cb-state-${UID} textarea`);
}

/* -----------------------------
   HELPERS
------------------------------ */
function getAnswerKey() {
    return DATA.answers[activeLevel];
}

function findCategory(value, blockGroups) {
    if (!blockGroups) return "Variables";

    for (const [cat, list] of Object.entries(blockGroups)) {
        if (list.includes(value)) return cat;
    }
    return "Variables";
}

/* -----------------------------
   BLOCK MERGE
------------------------------ */
function mergeBlocks(globalBlocks, levelBlocks, levelOnly=false) {
    const merged = levelOnly ? {} : JSON.parse(JSON.stringify(globalBlocks));

    for (const category in levelBlocks) {
        if (category === "levelOnly") continue;
        if (!merged[category]) merged[category] = [];
        merged[category].push(...levelBlocks[category]);
    }
    return merged;
}

/* -----------------------------
   INIT
------------------------------ */
function init() {
    

const root = document.getElementById(`cb-root-${UID}`);
if (!root) return;

const els = {
    root,
    blocksEl: root.querySelector(`#cb-blocks-${UID}`),
    slotsEl: root.querySelector(`#cb-slots-${UID}`),
    codeEl: root.querySelector(`#cb-code-${UID}`),
    templateEl: root.querySelector(`#cb-template-${UID}`),
    checkBtn: root.querySelector(`#cb-check-${UID}`),
    feedback: root.querySelector(`#cb-feedback-${UID}`),
    clearBtn: root.querySelector(`#cb-clear-${UID}`)
};

els.blocksEl.style.display = "flex";
els.blocksEl.style.flexDirection = "column";
els.blocksEl.style.gap = "18px";

    const levelBlocks = DATA.levelBlocks[activeLevel];
    if (!levelBlocks) {
        console.error("Bad level");
        return;
    }

    const blockGroups = mergeBlocks(
        DATA.globalBlocks,
        levelBlocks,
        levelBlocks.levelOnly === true
    );

    let slots = [];
    let dragged = null;

    const widget = getStateTextarea();

    const answerKey = getAnswerKey();
    const slotCount = answerKey[0].length;

    /* -----------------------------
       LOAD STATE SAFELY
    ------------------------------ */
    function loadSlots() {
        if (!widget?.value) return new Array(slotCount).fill(null);

        try {
            const data = JSON.parse(widget.value);
            if (!data?.response?.slots) return new Array(slotCount).fill(null);

            return data.response.slots.map(v =>
                v ? { value: v, category: findCategory(v, blockGroups) } : null
            );
        } catch {
            return new Array(slotCount).fill(null);
        }
    }

    slots = loadSlots();

    /* -----------------------------
       RENDER BLOCKS
    ------------------------------ */
    function renderBlocks() {
        els.blocksEl.innerHTML = "";

        Object.keys(blockGroups).forEach(category => {

            const section = document.createElement("div");

            const title = document.createElement("div");
            title.innerHTML = `▼ ${category}`;
            title.style.cssText = `
                font-size:12px;
                font-weight:700;
                letter-spacing:1px;
                color:#666;
                margin-bottom:8px;
                cursor:pointer;
                user-select:none;
            `;
            
            const row = document.createElement("div");
            row.style.cssText = `
                display:flex;
                flex-wrap:wrap;
                gap:10px;
            `;
            
            let expanded = true;
            
            title.onclick = () => {
                expanded = !expanded;
                row.style.display = expanded ? "flex" : "none";
                title.innerHTML = `${expanded ? "▼" : "▶"} ${category}`;
            };
            
            section.appendChild(title);

            blockGroups[category].forEach(b => {

                const div = document.createElement("div");
                div.textContent = b;
                div.dataset.value = b;
                div.dataset.category = category;
                div.draggable = true;

                div.style.cssText =
                    `padding:10px 14px;
                     background:${DATA.colors[category]};
                     color:white;border-radius:12px;
                     cursor:grab;font-size:15px;font-weight:600;`;

                div.addEventListener("dragstart", () => {
                    dragged = { value: b, category };
                    updateTemplate(b);
                });
                
                div.addEventListener("dblclick", () => {
                    updateTemplate(b);
                
                    const empty = slots.findIndex(s => s === null);
                    if (empty === -1) return;
                
                    slots[empty] = { value: b, category };
                    refresh();
                });

                div.addEventListener("click", () => {
                    updateTemplate(b);
                });

                row.appendChild(div);
            });

            section.appendChild(row);
            els.blocksEl.appendChild(section);
        });
    }

    /* -----------------------------
       RENDER SLOTS
    ------------------------------ */
    function renderSlots() {
        els.slotsEl.innerHTML = "";

        for (let i = 0; i < slotCount; i++) {

            const slot = document.createElement("div");
            const item = slots[i];

            const width = item
                ? Math.max(95, item.value.length * 11)
                : 95;
            
            slot.style.cssText = `
                width:${width}px;
                height:65px;
                border:2px dashed #ccc;
                border-radius:14px;
                display:flex;
                align-items:center;
                justify-content:center;
                position:relative;
                background:${item ? DATA.colors[item.category] : "#fafafa"};
                color:white;
                font-weight:600;
                font-size:18px;
                white-space:nowrap;
                transition:width .15s ease;
            `;

            slot.textContent = item ? item.value : "";

            slot.addEventListener("dragover", e => e.preventDefault());

            slot.addEventListener("drop", e => {
                e.preventDefault();
                if (!dragged) return;

                slots[i] = { ...dragged };
                refresh();
            });

            const x = document.createElement("div");
            x.textContent = "×";
            x.style.cssText = "position:absolute;top:4px;right:6px;cursor:pointer;color:#999;font-weight:700;";
            x.onclick = () => {
                slots[i] = null;
                refresh();
            };

            slot.appendChild(x);
            els.slotsEl.appendChild(slot);
        }
    }

    /* -----------------------------
       CODE VIEW
    ------------------------------ */
    function updateCode() {
        const line = slots.filter(Boolean).map(x => x.value).join("");
        els.codeEl.textContent = line || "Your code will appear here...";
    }

    function updateTemplate(block) {
        els.templateEl.textContent =
            DATA.templates[block] || "Click or drag a function block.";
    }

    /* -----------------------------
       SAVE STATE
    ------------------------------ */
function save(bestMatch = null, bestLength = null) {

    const ta = getStateTextarea();
    if (!ta) return;

    const user = slots.map(s => s ? s.value : "");
    const targets = getAnswerKey();

    // If no values were supplied, compute them here
    if (bestMatch === null || bestLength === null) {

        bestMatch = 0;
        bestLength = 0;

        targets.forEach(target => {

            let matches = 0;

            target.forEach((value, i) => {
                if (value !== "" && user[i] === value) {
                    matches++;
                }
            });

            if (matches > bestMatch) {
                bestMatch = matches;
                bestLength = target.filter(x => x !== "").length;
            }

        });
    }

    console.log(user.length, targets[0].length);
    console.log(user);
    console.log(targets[0]);
    
    const correct = targets.some(target =>
        user.length === target.length &&
        user.every((v, i) => v === target[i])
    );

    ta.value = JSON.stringify({
        type: "codebuilder",
        uid: UID,
        level: activeLevel,
        response: {
            slots: user,
            code: els.codeEl.textContent
        },
        evaluation: {
            correct,
            bestMatch,
            bestLength
        }
    });

    ta.dispatchEvent(new Event("input", { bubbles: true }));
}

function refresh() {
    renderSlots();
    updateCode();
    save();
}

    /* -----------------------------
       EVENTS
    ------------------------------ */
els.checkBtn.onclick = () => {

    const user = slots.map(x => x ? x.value : "");
    const targets = getAnswerKey();

    let bestMatch = 0;
    let bestLength = 0;

    targets.forEach(target => {

        let matches = 0;

        target.forEach((value, i) => {
            if (value !== "" && user[i] === value)
                matches++;
        });

        if (matches > bestMatch) {
            bestMatch = matches;
            bestLength = target.filter(x => x !== "").length;
        }
    });

    save(bestMatch, bestLength);

    const correct = targets.some(target =>
        user.length === target.length &&
        user.every((v, i) => v === target[i])
    );

var hooray = '✓ Correct!';

    if (correct) {
        els.feedback.textContent =
            hooray;
        els.feedback.style.color = "green";
    } else {
        els.feedback.textContent = `✗ Try again (${bestMatch}/${bestLength})`;
        els.feedback.style.color = "red";
    }
};
