<div id="cb-root-%%UID%%"
     style="font-family:Segoe UI,Arial,sans-serif;
            max-width:1100px;
            margin:12px auto;
            display:grid;
            grid-template-columns:320px 1fr;
            gap:18px;">

  <!-- LEFT PANEL -->
  <div style="background:#fff;
              border:1px solid #e5e5e5;
              border-radius:16px;
              padding:18px;">

    <div style="font-size:20px;
                font-weight:700;
                margin-bottom:14px;">
      Code Blocks
    </div>

    <div id="cb-blocks-%%UID%%"
         style="display:flex;
                flex-wrap:wrap;
                gap:10px;">
    </div>

    <button id="cb-clear-%%UID%%"
            style="margin-top:18px;
                   width:100%;
                   background:#d64545;
                   color:white;
                   border:none;
                   border-radius:10px;
                   padding:10px;
                   font-size:14px;
                   font-weight:600;
                   cursor:pointer;">
      Clear Workspace
    </button>
  </div>

  <!-- RIGHT PANEL -->
  <div style="background:#fff;
              border:1px solid #e5e5e5;
              border-radius:16px;
              padding:18px;">

    <div style="font-size:20px;
                font-weight:700;
                margin-bottom:14px;">
      Workspace
    </div>

    <!-- DROP SLOTS -->
    <div id="cb-slots-%%UID%%"
         style="display:flex;
                flex-wrap:wrap;
                gap:12px;
                margin-bottom:22px;">
    </div>

    <!-- LIVE CODE -->
    <div id="cb-code-%%UID%%"
         style="background:#111;
                color:#5cff87;
                font-family:Consolas,monospace;
                border-radius:12px;
                min-height:70px;
                padding:16px;
                font-size:18px;
                margin-bottom:20px;">
      Your code will appear here...
    </div>

    <!-- TEMPLATE PREVIEW -->
    <div style="background:#eef5ff;
                border:1px solid #cfe0ff;
                border-radius:12px;
                padding:16px;">

      <div style="font-size:11px;
                  font-weight:700;
                  letter-spacing:1.5px;
                  color:#4d79d8;
                  margin-bottom:8px;
                  text-transform:uppercase;">
        Function Structure
      </div>

      <div id="cb-template-%%UID%%"
           style="font-family:Consolas,monospace;
                  font-size:18px;
                  color:#222;">
        Click or drag a function block.
      </div>
    </div>
    <button id="cb-check-%%UID%%"
        style="
          margin-top:10px;
          width:100%;
          background:#4caf50;
          color:white;
          border:none;
          padding:10px;
          border-radius:10px;
          font-weight:600;
          cursor:pointer;">
  Check Answer
</button>

<div id="cb-feedback-%%UID%%"
     style="margin-top:10px;font-weight:600;"></div>
  </div>
</div>

<script type='text/javascript' src='https://temple.2i2c.cloud/dEuMNB0R57UPnuYhNfPot9dNLtri3E4TE9m0pPmBN2nGG3-IXYPmn48TxugWObPfb9aFbo09OCtaXdeQ53ZKtU04SB8DnV-SMUSWNxMN7X0LdpOfpci1rN4BSGiY9yEU1ft7OzgSe8hhAdee8kQm_T1QOAF_QsJq-07ViJd30R8zh5GEJ_5wkCxCGg_WAYhYYSWXTexBvI05biJqusQa64t-OG3_mOjvid1UTsjTJ40kHrKUwZQCU-LWgpe4jaOeakK9lFoWWXUFRb6o8pye3EB_SkBkD1QzyLRPOJfBmhnjx1o14iLIMN5N-9bUKLjUgSByr8dL40xw5lyp5J8t_1ACoS3Zcqs0lqIyc47cg3QEM6mDV-x4nWtxL6jFtELcHNZPsEs5byfJEv84OzHF1SJJGvZhYlcKidPv-bhgi3ULkrmgMjJ2OdXoS5oFwfWpUX-zgXHFA3nHeELhJeEPEkkxTSOc5NQEBTivPmss4t6aeQcuakpoWggW-4xF6_JbdyLex6kpqTUdkEkqMMbNQLQ3xjM_u4wYibprKHXBlTimyrL-H2HHPuGQ_mR_089wg2oI6yNpjWEhxlOopZtlv96XAiYc0SXXheZT_xZ8aJFifxZt7yEVEJ_ZR5T3FmG-FrkCMwTGQw'></script><script>
(function () {

const DATA = {

  globalBlocks: {
    'Functions': ['print'],
    'Variables': ['x', 'y', 'z'],
    'Numbers': ['5', '10'],
    'Operators': ['+', '-', '*', '/', '='],
    'Syntax': ['(', ')', ',', ':', "'", "."]
  },

  levelBlocks: {

    level0: {
    },

    level1: {
    },

    level2: {
    },
    level3: {
      'Variables': ['time_total', 'time_to', 'time_shop', 'time_back', 'distance']
    },
    level4: {
      'Variables': ['average_speed', 'time_total', 'time_to', 'time_shop', 'time_back', 'distance', 'dist_shopping']
    }
  },

  colors: {
    'Functions': '#7c4dff',
    'Variables': '#2196f3',
    'Numbers': '#43a047',
    'Operators': '#ef6c00',
    'Syntax': '#757575',
    'Strings': '#c2185b'
  },

    templates: {
        'print': 'print(anything)',
        'np.arange': 'np.arange(start, stop, step)',
        'len': 'len(list or array)'
    },
      
    answers: {
        level1: [['x', '=', '5', "", ""], ['x', '=', 'y', '+', 'z'], ['x', '=', 'z', '+', 'y'], ['x', '=', '10', '-', '5']],
        level0: [['print', '(', 'x', ')'], ['print', '(', 'x', ')']],
        level2: [['print', '(', 'z', ',', 'y', '+', 'x', ')'], ['print', '(', 'z', ',', 'y', '+', 'x', ')']],
        level3: [['time_total', '=', 'time_to', '+', 'time_shop', '+', 'time_back'], ['time_total', '=', 'time_shop', '+', 'time_to', '+', 'time_back'],
                 ['time_total', '=', 'time_back', '+', 'time_shop', '+', 'time_to'], ['time_total', '=', 'time_shop', '+', 'time_back', '+', 'time_to'],
                 ['time_total', '=', 'time_back', '+', 'time_to', '+', 'time_shop'], ['time_total', '=', 'time_to', '+', 'time_back', '+', 'time_shop']],
        level4: [['average_speed', '=', '(', 'distance', '+', 'distance', '+', 'dist_shopping', ')', '/', 'time_total'],
                 ['average_speed', '=', '(', 'dist_shopping', '+', 'distance', '+', 'distance', ')', '/', 'time_total'],
                 ['average_speed', '=', '(', 'distance', '+', 'dist_shopping', '+', 'distance', ')', '/', 'time_total'],
                 ['average_speed', '=', '(', 'dist_shopping', '+', 'distance', '*', '2', ')', '/', 'time_total'],
                 ['average_speed', '=', '(', 'distance', '*', '2', '+', 'dist_shopping', ')', '/', 'time_total'],
                 ['average_speed', '=', '(', 'dist_shopping', '+', '2', '*', 'distance', ')', '/', 'time_total'],
                 ['average_speed', '=', '(', '2', '*', 'distance', '+', 'dist_shopping', ')', '/', 'time_total']]
    }
    };
  var UID  = %%UID%%;

  var activeLevel = "__LEVEL__";

  function mergeBlocks(globalBlocks, levelBlocks) {

  const merged = JSON.parse(JSON.stringify(globalBlocks));

  Object.keys(levelBlocks || {}).forEach(category => {

    if (!merged[category]) {
      merged[category] = [];
    }

    merged[category].push(...levelBlocks[category]);
  });

  return merged;
}

var blockGroups = mergeBlocks(
  DATA.globalBlocks,
  DATA.levelBlocks[activeLevel]
);
  var colors = DATA.colors;
  var templates = DATA.templates;

  var checkBtn = document.getElementById('cb-check-' + UID);
var feedback = document.getElementById('cb-feedback-' + UID);

  var dragged = null;

  var blocksEl   = document.getElementById('cb-blocks-' + UID);
  var slotsEl    = document.getElementById('cb-slots-' + UID);
  var codeEl     = document.getElementById('cb-code-' + UID);
  var templateEl = document.getElementById('cb-template-' + UID);
  var clearBtn   = document.getElementById('cb-clear-' + UID);

  function getAnswerKey() {
  return DATA.answers[activeLevel];
  }

  function getSequence() {
  return slots
    .filter(Boolean)
    .map(x => x.value);
}

  /* -------------------------------------------------- */
  /* BUILD BLOCKS                                       */
  /* -------------------------------------------------- */

 Object.keys(blockGroups).forEach(function (category) {

  /* category container */
  var section = document.createElement('div');

  section.style.marginBottom = '18px';

  /* category title */
  var title = document.createElement('div');

  title.textContent = category;

  title.style.cssText =
    'font-size:12px;' +
    'font-weight:700;' +
    'letter-spacing:1px;' +
    'text-transform:uppercase;' +
    'color:#888;' +
    'margin-bottom:8px;';

  section.appendChild(title);

  /* block row */
  var row = document.createElement('div');

  row.style.cssText =
    'display:flex;' +
    'flex-wrap:wrap;' +
    'gap:10px;';

  /* individual blocks */
  blockGroups[category].forEach(function (b) {

    var div = document.createElement('div');

    div.dataset.category = category;
div.dataset.value = b;

    div.textContent = b;

    div.draggable = true;

    div.style.cssText =
      'padding:10px 14px;' +
      'background:' + colors[category] + ';' +
      'color:white;' +
      'border-radius:12px;' +
      'cursor:grab;' +
      'font-size:15px;' +
      'font-weight:600;' +
      'user-select:none;' +
      'box-shadow:0 2px 5px rgba(0,0,0,0.12);';

    div.addEventListener('dragstart', function () {
  dragged = {
    value: b,
    category: category
  };
});

    div.addEventListener('click', function () {
      if (templates[b]) {
        templateEl.textContent = templates[b];
      }
    });

    div.addEventListener('dblclick', function () {

  var emptyIdx = slots.findIndex(s => s === null);

  if (emptyIdx === -1) return;

  slots[emptyIdx] = {
    value: div.dataset.value,
    category: div.dataset.category
  };

  renderSlots();
  updateCode();

  if (templates[div.dataset.value]) {
    templateEl.textContent = templates[div.dataset.value];
  }
});

    row.appendChild(div);
  });

  section.appendChild(row);

  blocksEl.appendChild(section);
});
  /* -------------------------------------------------- */
  /* BUILD DROP SLOTS                                   */
  /* -------------------------------------------------- */

const answerKey = DATA.answers[activeLevel];

/* use first valid answer to determine slot count */
const slotCount = answerKey[0].length;

  var slots = new Array(slotCount).fill(null);

function renderSlots() {
  if (!slotsEl) {
    console.error("slotsEl not found");
    return;
  }

  slotsEl.innerHTML = "";

  for (let i = 0; i < slotCount; i++) {
    const slot = document.createElement("div");
    slot.dataset.index = i;

let bg = "#fafafa";

if (slots[i]) {
  bg = colors[slots[i].category];
}

slot.style.cssText =
  "position:relative;" +
  "width:95px;" +
  "height:65px;" +
  "border:2px dashed #ccc;" +
  "border-radius:14px;" +
  "display:flex;" +
  "align-items:center;" +
  "justify-content:center;" +
  "background:" + bg + ";" +
  "color:white;" +
  "font-size:18px;" +
  "font-weight:600;";

    slot.textContent = slots[i] ? slots[i].value : "";

    slot.addEventListener("dragover", function (e) {
  e.preventDefault();
});

slot.addEventListener("drop", function (e) {
  e.preventDefault();

  if (!dragged) return;

  slots[i] = {
    value: dragged.value,
    category: dragged.category
  };

  renderSlots();
  updateCode();

  if (templates[dragged.value]) {
    templateEl.textContent = templates[dragged.value];
  }
});

    // safe X button
    const xBtn = document.createElement("div");
    xBtn.textContent = "×";
    xBtn.style.cssText =
      "position:absolute;top:4px;right:6px;cursor:pointer;font-weight:700;color:#999;";

    xBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      slots[i] = null;
      renderSlots();
      updateCode();
    });

    slot.appendChild(xBtn);

    slotsEl.appendChild(slot);
  }
}
  /* -------------------------------------------------- */
  /* UPDATE LIVE CODE                                   */
  /* -------------------------------------------------- */

  function updateCode() {

  var line = slots
    .filter(Boolean)
    .map(x => x.value)
    .join(' ');

  codeEl.textContent = line || 'Your code will appear here...';
}

checkBtn.addEventListener('click', function() {
var user = slots.map(function(x) {
  return x ? x.value : "";
});

var targets = getAnswerKey();

var correct = targets.some(function(target) {

  return (
    user.length === target.length &&
    user.every((v, i) => v === target[i])
  );
}); 

  feedback.textContent = correct ? "✓ Correct!" : "✗ Try again";
  feedback.style.color = correct ? "green" : "red";
});

  /* -------------------------------------------------- */
  /* CLEAR BUTTON                                       */
  /* -------------------------------------------------- */

clearBtn.addEventListener('click', function () {
  slots = new Array(slotCount).fill(null);
  renderSlots();
  updateCode();
  templateEl.textContent = 'Click or drag a function block.';
});
    renderSlots();

})();

</script>
