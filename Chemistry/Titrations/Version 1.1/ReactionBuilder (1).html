    },
    
    5: {

          ],

        ],

        ],

                [['', 'Na^+', '2', 'C6H6O7^2-', ''], ['', 'Na^+', '', 'OH^-', '']],

            ],
            products: [

            ]
          }

};

const level = Levels[LEVEL];

if (!level) {
    throw new Error(`Unknown ReactionBuilder level: ${LEVEL}`);
}

function makeMolecule(layout = Layouts.Binary) {

  return {

    layout,

    coeff:"",
    ion1:"",
    sub1:"",
    ion2:"",
    sub2:""

  };

}

const wordbank = level.wordbank;

let reactants =
    level.reactants.map(layout => makeMolecule(layout));

let products =
    level.products.map(layout => makeMolecule(layout));

const answerKey = level.answers;


function formatIon(text) {

  return text

    // subscripts
    .replace(/([A-Za-z])(\d+)/g, (_, a, b) => {
      return a + "<sub>" + b + "</sub>";
    })

    // superscript charges
    .replace(/\^([0-9]*[+-])/g, (_, c) => {
      return "<sup>" + c + "</sup>";
    });
}

function normalize(v) {
  return String(v ?? "").trim();
}
    
function flattenMol(mol) {

  const fields = [];

  mol.layout.forEach(piece => {

    if (piece.field) {
      fields.push(normalize(mol[piece.field]));
    }

  });

  return fields;

}

    function flattenSide(side) {
  return side.map(flattenMol);
}
    
  function makeToken(text) {
    const div = document.createElement("div");
    div.innerHTML = formatIon(text);

    div.draggable = true;

    div.style.cssText =
      'padding:10px 14px;background:#444;color:white;border-radius:12px;' +
      'cursor:grab;font-weight:600;user-select:none;';

    div.addEventListener("dragstart", e => {
      dragged = text;
      e.dataTransfer.setData("text/plain", text);
    });

    return div;
  }

  function renderWordBank() {
    wordbankEl.innerHTML = "";
    wordbank.forEach(w => wordbankEl.appendChild(makeToken(w)));
  }

  /* ---------------- SLOT SYSTEM ---------------- */

function makeSlot(obj, field, type) {
  const box = document.createElement("div");

  const base =
    "display:flex;align-items:center;justify-content:center;" +
    "border-radius:8px;font-weight:600;user-select:none;" +
    "border:1px dashed #ccc;";

  if (type === "coeff") {
    box.style.cssText = base +
      "min-width:28px;height:38px;font-size:16px;" +
      "background:rgba(33,150,243,0.06);";
  }

  if (type === "ion") {
    box.style.cssText = base +
      "min-width:60px;height:38px;font-size:16px;" +
      "background:rgba(76,175,80,0.06);";
  }

  if (type === "sub") {
    box.style.cssText = base +
      "min-width:20px;height:22px;font-size:11px;" +
      "background:rgba(255,152,0,0.06);" +
      "transform:translateY(9px);"; // 👈 pushes it lower
  }

  function render() {
    box.innerHTML = obj[field] ? formatIon(obj[field]) : "";
  }

  render();
renderCounts();

  box.addEventListener("dragover", e => e.preventDefault());

box.addEventListener("drop", e => {
    e.preventDefault();
    obj[field] = String(dragged);
    render();
    renderCounts();
    save();
});

box.addEventListener("click", () => {
    obj[field] = "";
    render();
    renderCounts();
    save();
});

  return box;
}


  /* ---------------- RENDER ---------------- */

function renderMolecule(container, arr) {
  container.innerHTML = "";

  const wrapper = document.createElement("div");

  wrapper.style.cssText =
    "display:flex;align-items:flex-end;gap:8px;flex-wrap:nowrap;";

  arr.forEach((mol, i) => {
    const row = document.createElement("div");

    row.style.cssText =
  "display:flex;align-items:center;gap:6px;";

mol.layout.forEach(piece => {

  if(piece.type === "text"){

    const span = document.createElement("span");
    span.textContent = piece.value;
    span.style.fontWeight = "700";
    row.appendChild(span);

  } else {

    row.appendChild(
      makeSlot(
        mol,
        piece.field,
        piece.type
      )
    );

  }

});

    wrapper.appendChild(row);

    // ✅ ONLY add plus if not last
    if (i !== arr.length - 1) {
      const plus = document.createElement("div");
      plus.textContent = "+";
      plus.style.cssText =
        "padding:0 6px;" +
        "font-weight:700;" +
        "align-self:center;" +
        "transform:translateY(-2px);";
      wrapper.appendChild(plus);
    }
  });

  container.appendChild(wrapper);
}

    function countAtoms(side) {

  const counts = {};

  side.forEach(mol => {

    const coeff = Number(mol.coeff || 1);

    [
      [mol.ion1, mol.sub1],
      [mol.ion2, mol.sub2]
    ].forEach(([ion, sub]) => {

      if (!ion) return;

      const multiplier = Number(sub || 1);

      // split ions into atoms
      const matches = ion.match(/[A-Z][a-z]?\d*/g) || [];

      matches.forEach(piece => {

        const atomMatch = piece.match(/^([A-Z][a-z]?)(\d*)$/);

        const atom = atomMatch[1];
        const atomCount = Number(atomMatch[2] || 1);

        const total = coeff * multiplier * atomCount;

        counts[atom] = (counts[atom] || 0) + total;
      });
    });
  });

  return counts;
}

function renderCounts() {

  const reactantCounts = countAtoms(reactants);
  const productCounts = countAtoms(products);

  const atoms = [...new Set([
    ...Object.keys(reactantCounts),
    ...Object.keys(productCounts)
  ])];

  let html = `
    <div style="font-weight:700;margin-bottom:8px;">
      Atom Counts
    </div>
  `;

  atoms.forEach(atom => {

    const r = reactantCounts[atom] || 0;
    const p = productCounts[atom] || 0;

    const balanced = r === p;

    html += `
      <div>
        ${atom}: 
        Reactants = <b>${r}</b>,
        Products = <b>${p}</b>
        <span style="
          color:${balanced ? 'green' : 'red'};
          font-weight:700;">
          ${balanced ? '✓' : '✗'}
        </span>
      </div>
    `;
  });

  countsEl.innerHTML = html;
}

function loadState(){

    const ta = getStateTextarea();

    if(!ta || !ta.value)
        return;

    try {

        const data = JSON.parse(ta.value);

        if(data.response){

            data.response.reactants.forEach((mol,i)=>{
                const m = reactants[i];

                m.coeff = mol[0] || "";
                m.ion1  = mol[1] || "";
                m.sub1  = mol[2] || "";
                m.ion2  = mol[3] || "";
                m.sub2  = mol[4] || "";

            });


            data.response.products.forEach((mol,i)=>{
                const m = products[i];

                m.coeff = mol[0] || "";
                m.ion1  = mol[1] || "";
                m.sub1  = mol[2] || "";
                m.ion2  = mol[3] || "";
                m.sub2  = mol[4] || "";

            });

        }

    }
    catch(e){
        console.warn("Could not restore reaction");
    }

}

function save(correct=null){

    const ta = getStateTextarea();

    if(!ta) return;


    let old = {};

    try {
        old = JSON.parse(ta.value);
    }
    catch(e){}


    const data = {

        type:"reactionbuilder",
        uid:UID,
        level:LEVEL,

        response:{
            reactants:reactants.map(flattenMol),
            products:products.map(flattenMol)
        },

        evaluation:{
            correct: correct !== null 
                ? correct 
                : old?.evaluation?.correct ?? false
        }

    };


    ta.value = JSON.stringify(data);

    ta.dispatchEvent(
        new Event("input",{bubbles:true})
    );

}

function renderAll() {
  renderWordBank();
  renderMolecule(reactantsEl, reactants);
  renderMolecule(productsEl, products);
  renderCounts();
}

  /* ---------------- CHECK ---------------- */

function exactMatch(a, b) {

  if (a.length !== b.length) return false;

  return a.every((mol, i) => {

    if (mol.length !== b[i].length) return false;

    return mol.every((v, j) =>
      normalize(v) === normalize(b[i][j])
    );

  });

}
    
function matchesAny(userArr, options) {
  return options.some(option => exactMatch(userArr, option));
}

checkBtn.addEventListener("click", () => {
  const userReactants = flattenSide(reactants);
  const userProducts  = flattenSide(products);

    console.log("USER:", userReactants);
console.log("EXPECTED:", answerKey.reactants);

  const r = matchesAny(userReactants, answerKey.reactants);
  const p = matchesAny(userProducts, answerKey.products);

const correct = r && p;

save(correct);

feedbackEl.textContent =
    correct ? "✓ Correct!" : "✗ Try again";
  feedbackEl.style.color = correct ? "green" : "red";
});

  /* ---------------- INIT ---------------- */
  loadState();
  renderAll();
  save();

})();
</script>
