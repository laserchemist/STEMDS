<script type='text/javascript' src='https://temple.2i2c.cloud/hd0ZdDL13PW9Xm3FdqGtgZKevLS_-5Fjw2GSXX-FlP5QNkfmEgN1toOtMGF9j25uaGgVBUzbjxCEPDT-Q6sXf3CyHZMn-5A42S8eQBs-lEaD23wKrIrpyBb3airwTWVnqvY7wK5AhAkyMH6CdBUAJGCys3vSSgMeI292XSdsg7jw81YQm0C5dy9-pTE1CQvHYH0VcvzrKReYJ2AvUH6HIF7SjA58rZiQLv3WNueCaWF-I1FRd--3M6UjLesmwEYvsr9VF2FrVwgPUfPou3cERjAKWHKdpTEUxwID6ZhChq_tsD8gFerg3vvYaHxQF45sL7NkC4eF_GHWm4EYkTTRIN7Vw_ic_GeuB_vEtege5_9CQz7_AWXyJ9qQrHpIvpd8FZBdIOp7Pr_j58-AJzgbGi52IAs3P5SBuPwJzf6bzU92vjS-MEfYjLmlf_9nhSRIJukFDjFrnjBMpQgFoW4ou5cNKzoMyyhNV2TD0VVwQLg0bQq_5JdTKI6Qo89AeFJ7lSZW1iw3NhZZyKPDvTaimDXaPWaegUNKiC3Ukj0fS7Qi4A4HJWj875G7ytEMEHcPGSjGyN-thzvDi2OmzLf-4qtY22fSu0g6bbOHjdv8TokjUcwriCE-i7-3RVDzWspEVf8pFw'></script><script>
(function () {

  const UID = %%UID%%;

  const wordbankEl = document.getElementById('cb-wordbank-items-' + UID);
  const reactantsEl = document.getElementById('cb-reactants-' + UID);
  const productsEl  = document.getElementById('cb-products-' + UID);
  const checkBtn    = document.getElementById('cb-check-' + UID);
  const feedbackEl  = document.getElementById('cb-feedback-' + UID);
    const countsEl = document.getElementById('cb-counts-' + UID);

    const currentLevel = "%%level%%";

function getCurrentAnswer() {

  return levels.find(
    lvl => lvl.name === currentLevel
  );

}

  let dragged = null;

  /* ---------------- WORD BANK ---------------- */

  const wordbank = [
    "C6H8O7", "H3PO4", "C2H4O2", "Na^+", "OH^-", "H2O", "C2H3O2^-", "PO4^3-", "C6H5O7^3-", "2", "3", "4", "5", "6"
  ];

function formatIon(text) {

  return text

    // subscripts
    .replace(/([A-Za-z])(\d+)/g, (_, a, b) => {
      return a + "<sub>" + b + "</sub>";
    })

    // superscript charges
    .replace(/\^([0-9]*[+-])/g, (_, c) => {
      return "<sup>" + c + "</sup>";
    });
}

function normalize(v) {
  return String(v ?? "").trim();
}
    
function flattenMol(mol) {

  if (mol.type === "simple") {

    return [
      normalize(mol.coeff),
      normalize(mol.ion1)
    ];
  }

  return [
    normalize(mol.coeff),
    normalize(mol.ion1),
    normalize(mol.sub1),
    normalize(mol.ion2),
    normalize(mol.sub2)
  ];
}

    function flattenSide(side) {
  return side.map(flattenMol);
}
    
  function makeToken(text) {
    const div = document.createElement("div");
    div.innerHTML = formatIon(text);

    div.draggable = true;

    div.style.cssText =
      'padding:10px 14px;background:#444;color:white;border-radius:12px;' +
      'cursor:grab;font-weight:600;user-select:none;';

    div.addEventListener("dragstart", e => {
      dragged = text;
      e.dataTransfer.setData("text/plain", text);
    });

    return div;
  }

  function renderWordBank() {
    wordbankEl.innerHTML = "";
    wordbank.forEach(w => wordbankEl.appendChild(makeToken(w)));
  }

  /* ---------------- SLOT SYSTEM ---------------- */

function makeSlot(obj, field, type) {
  const box = document.createElement("div");

  const base =
    "display:flex;align-items:center;justify-content:center;" +
    "border-radius:8px;font-weight:600;user-select:none;" +
    "border:1px dashed #ccc;";

  if (type === "coeff") {
    box.style.cssText = base +
      "min-width:28px;height:38px;font-size:16px;" +
      "background:rgba(33,150,243,0.06);";
  }

  if (type === "ion") {
    box.style.cssText = base +
      "min-width:60px;height:38px;font-size:16px;" +
      "background:rgba(76,175,80,0.06);";
  }
  if (type === "sub") {
      box.style.cssText = base +
        "min-width:28px;height:28px;font-size:14px;" +
        "background:rgba(255,152,0,0.08);" +
        "align-self:flex-end;";
    }

  function render() {
    box.innerHTML = obj[field] ? formatIon(obj[field]) : "";
  }

  render();
renderCounts();

  box.addEventListener("dragover", e => e.preventDefault());

  box.addEventListener("drop", e => {
    e.preventDefault();
    obj[field] = String(dragged);
    render();
renderCounts();
  });

    box.addEventListener("click", () => {
  obj[field] = "";
  render();
renderCounts();
});

  return box;
}

  /* ---------------- MOLECULE STRUCTURE ---------------- */

function makeSimpleMolecule() {
  return {
    type: "simple",
    coeff: "",
    ion1: ""
  };
}

function makeCompoundMolecule() {
  return {
    type: "compound",
    coeff: "",
    ion1: "",
    sub1: "",
    ion2: "",
    sub2: ""
  };
}

let reactants = [
  makeSimpleMolecule(),
  makeCompoundMolecule()
];

let products = [
  makeSimpleMolecule(),
  makeCompoundMolecule()
];

  /* ---------------- RENDER ---------------- */

function renderMolecule(container, arr) {
  container.innerHTML = "";

  const wrapper = document.createElement("div");

  wrapper.style.cssText =
    "display:flex;align-items:flex-end;gap:8px;flex-wrap:nowrap;";

  arr.forEach((mol, i) => {
    const row = document.createElement("div");

    row.style.cssText =
  "display:flex;align-items:center;gap:6px;";

    row.appendChild(makeSlot(mol, "coeff", "coeff"));
    row.appendChild(makeSlot(mol, "ion1", "ion"));
    
    if (mol.type === "compound") {
    
      row.appendChild(makeSlot(mol, "sub1", "sub"));
    
      row.appendChild(makeSlot(mol, "ion2", "ion"));
    
      row.appendChild(makeSlot(mol, "sub2", "sub"));
    }

    wrapper.appendChild(row);

    // ✅ ONLY add plus if not last
    if (i !== arr.length - 1) {
      const plus = document.createElement("div");
      plus.textContent = "+";
      plus.style.cssText =
        "padding:0 6px;" +
        "font-weight:700;" +
        "align-self:center;" +
        "transform:translateY(-2px);";
      wrapper.appendChild(plus);
    }
  });

  container.appendChild(wrapper);
}

function countAtoms(side) {

  const counts = {};

  side.forEach(mol => {

    const coeff = Number(mol.coeff || 1);

    const pieces = [];

    if (mol.ion1) {
      pieces.push([
        mol.ion1,
        Number(mol.sub1 || 1)
      ]);
    }

    if (mol.type === "compound" && mol.ion2) {
      pieces.push([
        mol.ion2,
        Number(mol.sub2 || 1)
      ]);
    }

    pieces.forEach(([ion, multiplier]) => {

      const matches = ion.match(/[A-Z][a-z]?\d*/g) || [];

      matches.forEach(piece => {

        const atomMatch = piece.match(/^([A-Z][a-z]?)(\d*)$/);

        const atom = atomMatch[1];
        const atomCount = Number(atomMatch[2] || 1);

        const total =
          coeff *
          multiplier *
          atomCount;

        counts[atom] =
          (counts[atom] || 0) + total;
      });
    });

  });

  return counts;
}

function renderCounts() {

  const answer = getCurrentAnswer();

const reactantCounts = countAtoms(reactants);
const productCounts  = countAtoms(products);

  const atoms = [...new Set([
    ...Object.keys(reactantCounts),
    ...Object.keys(productCounts)
  ])];

  let html = `
    <div style="font-weight:700;margin-bottom:8px;">
      Atom Counts
    </div>
  `;

  atoms.forEach(atom => {

    const r = reactantCounts[atom] || 0;
    const p = productCounts[atom] || 0;

    const balanced = r === p;

    html += `
      <div>
        ${atom}: 
        Reactants = <b>${r}</b>,
        Products = <b>${p}</b>
        <span style="
          color:${balanced ? 'green' : 'red'};
          font-weight:700;">
          ${balanced ? '✓' : '✗'}
        </span>
      </div>
    `;
  });

  countsEl.innerHTML = html;
}

function renderAll() {
  renderWordBank();
  renderMolecule(reactantsEl, reactants);
  renderMolecule(productsEl, products);
  renderCounts();
}

  /* ---------------- CHECK ---------------- */

const levels = [

  {
    name: "Acetic",

    reactants: [
      [
        ['', 'C2H4O2'],
        ['', 'Na^+', '', 'OH^-', '']
      ]
    ],

    products: [
      [
        ['', 'H2O'],
        ['', 'Na^+', '', 'C2H3O2^-', '']
      ]
    ]
  },

  {
    name: "Citric",

    reactants: [
      [
        ['', 'C6H8O7'],
        ['3', 'Na^+', '', 'OH^-', '']
      ]
    ],

    products: [
      [
        ['3', 'H2O'],
        ['', 'Na^+', '3', 'C6H5O7^3-', '']
      ]
    ]
  },

  {
    name: "Phosphoric",

    reactants: [
      [
        ['', 'H3PO4'],
        ['3', 'Na^+', '', 'OH^-', '']
      ]
    ],

    products: [
      [
        ['3', 'H2O'],
        ['', 'Na^+', '3', 'PO4^3-', '']
      ]
    ]
  }

];

function exactMatch(a, b) {

  if (a.length !== b.length) {
    return false;
  }

  return a.every((mol, i) => {

    if (mol.length !== b[i].length) {
      return false;
    }

    return mol.every((piece, j) =>
      normalize(piece) === normalize(b[i][j])
    );

  });
}
function matchesAny(userArr, options) {
  return options.some(option => exactMatch(userArr, option));
}

checkBtn.addEventListener("click", () => {

  const answer = getCurrentAnswer();

  const userReactants = flattenSide(reactants);
  const userProducts  = flattenSide(products);

  const r = matchesAny(
    userReactants,
    answer.reactants
  );

  const p = matchesAny(
    userProducts,
    answer.products
  );

  const correct = r && p;

  feedbackEl.textContent =
    correct ? "✓ Correct!" : "✗ Try again";

  feedbackEl.style.color =
    correct ? "green" : "red";
});

  /* ---------------- INIT ---------------- */

  renderAll();

})();
</script>
